# Profile dev: dùng database Railway thật, bỏ qua HTTPS validator của prod
# Datasource: dùng từ application.properties (PostgreSQL Railway)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.h2.console.enabled=false

app.seed-demo-data=false
app.payment.provider=mock
app.payment.mock.enabled=true
app.payment.mock-signature=local-test-payment-signature
app.email.provider=console
app.sms.provider=console
